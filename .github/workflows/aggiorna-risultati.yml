name: Aggiornamento rapido risultati
on:
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Prova fonti nazionali
        run: |
          cd scraper
          python - <<'EOF'
          import sys
          sys.argv=["x"]
          import fetch_nazionali as N, fetch_nazionali_fipav as F
          from bs4 import BeautifulSoup
          print("=== LEGAVOLLEY superlega")
          try:
              h=N.scarica(N.URL.format(id=999)); s=BeautifulSoup(h,"html.parser"); n=0
              for tr in s.find_all("tr"):
                  if "tab-gara" in (tr.get("class") or []) and "SIR" in tr.get_text().upper():
                      print(str(tr)[:1800]); n+=1
                      if n>=2: break
          except Exception as e: print("ERR",e)
          print("=== LVF A2")
          try:
              h=F.scarica_lvf(F.LVF_A2_URL); s=BeautifulSoup(h,"html.parser")
              ts=s.select("table.risultati"); print(len(ts))
              for t in ts:
                  if "BARTOCCINI" in t.get_text().upper(): print(str(t)[:2500]); break
          except Exception as e: print("ERR",e)
          print("=== PORTALE NAZIONALI")
          try:
              h=F.scarica(F.URL.format(d="02/11/2026")); s=BeautifulSoup(h,"html.parser"); n=0
              for t in s.find_all("table"):
                  cap=t.find("caption")
                  if not cap or "NAZIONALI" not in cap.get_text().upper(): continue
                  for tr in t.find_all("tr"):
                      if "/26" in tr.get_text():
                          print(str(tr)[:1800]); n+=1
                          if n>=2: break
                  break
          except Exception as e: print("ERR",e)
          EOF
