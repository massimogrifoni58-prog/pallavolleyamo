name: Aggiornamento rapido risultati
on:
  workflow_dispatch:
concurrency:
  group: aggiornamento-dati
  cancel-in-progress: false
jobs:
  risultati:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Scopri CId
        run: |
          cd scraper
          python scopri_cid.py
