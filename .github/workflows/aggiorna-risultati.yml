name: Aggiornamento rapido risultati
on:
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Mostra righe grezze
        run: |
          python - <<'EOF'
          import urllib.request
          from bs4 import BeautifulSoup
          url="https://umbria.portalefipav.net/risultati-classifiche.aspx?ComitatoId=30&StId=2410&DataDa=&StatoGara=&CId=93845&SId=&PId=7323&btFiltro=CERCA"
          h=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=30).read().decode("utf-8","ignore")
          s=BeautifulSoup(h,"html.parser")
          n=0
          for r in s.find_all("tr"):
              c=r.find_all("td")
              if len(c)>=6 and "/26" in r.get_text():
                  print("ROW:",[x.get_text(" ",strip=True) for x in c]); print("HTML:",str(r)[:2500]); n+=1
                  if n>=3: break
          print("link:",[a.get("href") for a in s.find_all("a",href=True) if "gara" in a["href"].lower() or "referto" in a["href"].lower()][:5])
          EOF
