name: Diagnosi risultati nazionali
on:
  push:
    branches: [diag-nazionali]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Prova secondo percorso
        run: |
          mkdir -p diag
          (cd scraper && python fetch_nazionali.py) > diag/prova2.txt 2>&1 || true
          python - >> diag/prova2.txt 2>&1 <<'PY'
          import json
          d=json.load(open("react-app/data/risultati_nazionali.json",encoding="utf-8"))
          m=d.get("matches",[])
          print("partite",len(m),"disputate",sum(1 for x in m if x.get("status")=="disputata"))
          for x in m:
              if x.get("status")=="disputata": print(x["competition"],x["home"],x["score"],x["away"],x.get("dataIso"))
          PY
          git config user.email bot@example.com; git config user.name diag
          git add diag && git commit -qm "diag prova2" && git push
